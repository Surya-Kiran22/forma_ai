# Render Blueprint configuration for Forma AI Unified Monorepo (Single Service)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------
  # Unified Web Service (Backend Express + Frontend React)
  # ----------------------------------------------------
  - type: web
    name: forma-ai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm install @rollup/rollup-linux-x64-gnu && npm run build
    startCommand: npm start --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
